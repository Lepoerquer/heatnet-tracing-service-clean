# Параметры по глубине: Техническое приложение, табл. 4.3 и раздел 6 (6.1)
# + протокол встречи 16.09.2026, п. 6.
# Используется дополнительной задачей M11 и формулой Kгл в ru.heatnet.cost.DepthCoefficient.
source: "Техническое приложение, табл. 4.3, разд. 6; протокол 16.09.2026 п. 6"

depth:
  normal_depth_m: 3.0          # обычная глубина до верха габарита новой сети
  min_depth_m: 0.7             # разд. 6: «минимальная допустимая глубина – 0,7 м»
  # AUDIT-24.09 (Claude): min_offset_m в расчёте профиля НЕ применяется. По Разъяснению №16 при расхождении
  # действует актуальное техническое приложение, а его табл. 5.1 задаёт вертикальный просвет по типу объекта
  # (газ 0,2 м, кабель 0,5 м, теплосеть 0,5 м — existing_utilities.*.vertical_clearance_m ниже).
  # Поле оставлено для совместимости загрузчика конфигурации (ReferenceDataLoader требует его наличия).
  min_offset_m: 0.7            # протокол 16.09 п. 6 (устарело, см. выше)
  step_m: null                 # протокол п. 6: шага 0,5 м в актуальном приложении нет; null = непрерывно
  max_slope_m_per_m: 0.10      # 1 м глубины = не менее 10 м по горизонтали
  point_crossing_plateau_m: 4.0  # газ/кабель/теплосеть: по 2 м с каждой стороны от точки пересечения
  cost:
    threshold_depth_m: 3.0     # при h <= 3,0 м Kгл = 1
    rate_per_extra_m: 0.10     # Kгл = 1 + 0,10 · (h − 3)

# Табл. 4.3: условные параметры существующих линейных объектов.
# vertical_clearance_m — мин. вертикальный просвет из табл. 5.1.
existing_utilities:
  gas_pipeline:
    width_m: 0.400
    height_m: 0.400
    top_depth_m: 2.8
    vertical_clearance_m: 0.2
  power_cable:
    width_m: 0.200
    height_m: 0.200
    top_depth_m: 2.7
    vertical_clearance_m: 0.5
  heat_network:
    gabarit_by_dn: true        # габарит по её DN из gabarits.yaml
    top_depth_m: 3.0
    vertical_clearance_m: 0.5

# Табл. 5.1, «Правило по глубине» для площадных пересечений (под объектом).
surface_crossings:
  road:
    min_top_depth_below_surface_m: 1.0   # верх габарита новой сети не менее 1,0 м ниже поверхности
    zone_margin_m: 3.0                   # полигон + 3 м с каждой стороны
  tram_tracks:
    min_top_depth_below_surface_m: 1.2
    zone_margin_m: 3.0
