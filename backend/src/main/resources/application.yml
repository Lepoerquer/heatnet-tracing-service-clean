spring:
  application:
    name: heatnet-tracing-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: ${HEATNET_MAX_UPLOAD_SIZE:3GB}
      max-request-size: ${HEATNET_MAX_UPLOAD_SIZE:3GB}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

heatnet:
  service-version: 0.1.0-SNAPSHOT
  config-dir: ${HEATNET_CONFIG_DIR:../config}
  data-dir: ${HEATNET_DATA_DIR:../data}
  ingest-snap-tolerance-m: ${HEATNET_INGEST_SNAP_TOLERANCE_M:1.0}
  ingest-chamber-snap-report-tolerance-m: ${HEATNET_INGEST_CHAMBER_SNAP_REPORT_TOLERANCE_M:0.5}
